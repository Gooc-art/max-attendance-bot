name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - skud-prod
    concurrency:
      group: skud-prod
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write runtime env
        env:
          SKUD_ENV: ${{ secrets.SKUD_ENV }}
        run: |
          if [ -n "$SKUD_ENV" ]; then
            mkdir -p "$HOME/skud"
            printf '%s\n' "$SKUD_ENV" > "$HOME/skud/.env"
            chmod 600 "$HOME/skud/.env"
          fi

      - name: Deploy to local host
        run: bash scripts/deploy_local_linux.sh
