name: Prod diagnostics

on:
  workflow_dispatch:

jobs:
  substitutions:
    runs-on:
      - self-hosted
      - skud-prod
    steps:
      - name: Read substitution state
        run: |
          python3 - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db_path = Path.home() / "skud" / "data" / "attendance_bot.db"
          print(f"db_path={db_path}")
          print(f"db_exists={db_path.exists()}")
          if not db_path.exists():
              raise SystemExit(1)

          connection = sqlite3.connect(db_path)
          connection.row_factory = sqlite3.Row

          query = """
          select
            id,
            created_by_user_id,
            target_manager,
            target_user_id,
            replacement_user,
            replacement_user_id,
            reason,
            date_from,
            date_to,
            departments_json,
            status,
            created_at
          from substitution_drafts
          where target_manager like '%Посунько%'
             or replacement_user like '%Кудряв%'
             or target_manager like '%Кудряв%'
             or replacement_user like '%Посунько%'
          order by id desc
          limit 20
          """
          rows = [dict(row) for row in connection.execute(query)]
          print("matched_substitutions=")
          print(json.dumps(rows, ensure_ascii=False, indent=2))

          status_rows = [
              dict(row)
              for row in connection.execute(
                  "select status, count(*) as count from substitution_drafts group by status order by status"
              )
          ]
          print("status_counts=")
          print(json.dumps(status_rows, ensure_ascii=False, indent=2))
          PY
