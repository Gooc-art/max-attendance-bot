name: Prod diagnostics

on:
  workflow_dispatch:

jobs:
  substitutions:
    runs-on:
      - self-hosted
      - skud-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read active substitution state
        run: |
          cd "$HOME/skud"
          . .venv/bin/activate
          python3 - <<'PY'
          import json
          from app.repositories.substitution_repository import SubstitutionRepository

          repo = SubstitutionRepository()
          rows = repo.list_approved_overlapping("2026-06-26", "2026-06-26")
          matched = [
              {
                  "id": row.id,
                  "target_manager": row.target_manager,
                  "target_user_id": row.target_user_id,
                  "replacement_user": row.replacement_user,
                  "replacement_user_id": row.replacement_user_id,
                  "date_from": row.date_from,
                  "date_to": row.date_to,
                  "status": row.status,
                  "departments": repo.departments_for_draft(row),
              }
              for row in rows
              if "Посунько" in row.target_manager or "Кудрявцева" in row.replacement_user
          ]
          print(json.dumps(matched, ensure_ascii=False, indent=2))
          PY
